[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/biometrics/face/models", "backend/biometrics/voice/models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E701", "E702", "E741"]
"backend/*" = ["E402"]
"migrations/env.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
