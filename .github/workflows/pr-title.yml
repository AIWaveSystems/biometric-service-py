name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            perf
            chore
            build
            ci
            style
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            El subject debe ir en minúscula, en imperativo y sin punto final.
